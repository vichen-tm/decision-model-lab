[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-model-lab"
version = "0.1.0"
description = "Agent-guided evaluation of finite-choice model decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.scripts]
decision-lab = "decision_lab.cli:main"

[tool.setuptools.packages.find]
include = ["decision_lab*", "decision_benchmark*"]
